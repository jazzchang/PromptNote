<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咒语便签 - PromptNote</title>
    <style>
        /* ─── Reset & Variables ─────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0f0f13;
            --bg-secondary: #1a1a24;
            --bg-card: #1e1e2e;
            --bg-input: #252535;
            --bg-hover: rgba(99, 102, 241, 0.08);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-2: #8b5cf6;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --text-primary: #f0f0ff;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            width: 380px;
            min-height: 520px;
            max-height: 600px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
            font-size: 13px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* ─── Header ────────────────────────────────────────────────────────── */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);
            padding: 14px 16px 12px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 3px 12px rgba(99, 102, 241, 0.4);
            flex-shrink: 0;
        }

        .title-group h1 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .title-group p {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 14px;
        }

        .icon-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
            color: var(--accent);
        }

        /* Eagle Status */
        .eagle-status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }

        .eagle-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid transparent;
        }

        .eagle-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .eagle-status.connected {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .eagle-status.connected .dot {
            background: #10b981;
            animation: pulse-green 2s infinite;
        }

        .eagle-status.disconnected {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .eagle-status.disconnected .dot {
            background: #ef4444;
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            50% { box-shadow: 0 0 0 4px rgba(16, 185, 129, 0); }
        }

        /* ─── Tabs ──────────────────────────────────────────────────────────── */
        .tabs {
            display: flex;
            background: var(--bg-secondary);
            padding: 4px;
            margin: 12px 12px 0;
            border-radius: var(--radius-sm);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .tab-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 10px;
        }

        /* ─── Tab Content ───────────────────────────────────────────────────── */
        .tab-content {
            display: none;
            padding: 12px;
        }

        .tab-content.active {
            display: block;
        }

        /* ─── Not Jimeng Warning ────────────────────────────────────────────── */
        .not-jimeng-warning {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
            gap: 14px;
        }

        .not-jimeng-warning.show {
            display: flex;
        }

        .warning-icon {
            font-size: 42px;
            filter: grayscale(0.3);
        }

        .warning-title {
            font-size: 14px;
            font-weight: 600;
        }

        .warning-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .open-jimeng-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 4px;
        }

        .open-jimeng-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        /* ─── Folder Selector ───────────────────────────────────────────────── */
        .folder-section {
            margin-bottom: 12px;
        }

        .folder-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .folder-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .folder-count {
            font-size: 10px;
            color: var(--text-muted);
        }

        .folder-select-wrapper {
            position: relative;
        }

        .folder-select {
            width: 100%;
            padding: 10px 36px 10px 12px;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            cursor: pointer;
            appearance: none;
            transition: var(--transition);
            font-family: inherit;
        }

        .folder-select:hover,
        .folder-select:focus {
            border-color: var(--border-hover);
            outline: none;
        }

        .folder-select-arrow {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-muted);
        }

        /* ─── Tags Section ──────────────────────────────────────────────────── */
        .tags-section {
            margin-bottom: 12px;
        }

        .tags-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .tags-input-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .tags-input {
            flex: 1;
            padding: 8px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            transition: var(--transition);
        }

        .tags-input:focus {
            border-color: var(--border-hover);
        }

        .tags-display {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 24px;
        }

        .tag-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 12px;
            font-size: 11px;
            color: var(--accent);
            transition: var(--transition);
        }

        .tag-item:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        .tag-remove {
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
        }

        /* ─── Note Section ──────────────────────────────────────────────────── */
        .note-section {
            margin-bottom: 12px;
        }

        .note-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .note-input {
            width: 100%;
            min-height: 60px;
            max-height: 100px;
            padding: 8px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            resize: vertical;
            transition: var(--transition);
            font-family: inherit;
        }

        .note-input:focus {
            border-color: var(--border-hover);
        }

        /* ─── Image List ────────────────────────────────────────────────────── */
        .image-list-section {
            margin-bottom: 12px;
        }

        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .list-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .list-actions {
            display: flex;
            gap: 6px;
        }

        .list-action-btn {
            font-size: 11px;
            padding: 4px 8px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .list-action-btn:hover {
            border-color: var(--border-hover);
            color: var(--accent);
        }

        .image-list {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
        }

        .image-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
        }

        .image-item:last-child {
            border-bottom: none;
        }

        .image-item:hover {
            background: var(--bg-hover);
        }

        .image-item.selected {
            background: rgba(99, 102, 241, 0.12);
        }

        .image-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .image-item.selected .image-checkbox {
            background: var(--accent);
            border-color: var(--accent);
        }

        .image-checkbox svg {
            width: 12px;
            height: 12px;
            opacity: 0;
            transition: var(--transition);
        }

        .image-item.selected .image-checkbox svg {
            opacity: 1;
        }

        .image-thumb {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
            background: var(--bg-input);
            flex-shrink: 0;
        }

        .image-info {
            flex: 1;
            min-width: 0;
        }

        .image-name {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .image-prompt {
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .image-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .mini-btn {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: var(--transition);
        }

        .mini-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* ─── Action Buttons ────────────────────────────────────────────────── */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn:hover {
            border-color: var(--border-hover);
            background: var(--bg-hover);
        }

        .action-btn.primary {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
        }

        .action-btn.primary:hover {
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.5);
            transform: translateY(-1px);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .action-btn.loading {
            pointer-events: none;
            animation: btn-loading 1.5s ease-in-out infinite;
        }

        @keyframes btn-loading {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ─── History Tab ───────────────────────────────────────────────────── */
        .history-search-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .history-search {
            flex: 1;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            transition: var(--transition);
        }

        .history-search:focus {
            border-color: var(--border-hover);
        }

        .format-select {
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .format-select:focus {
            border-color: var(--border-hover);
        }

        .history-list {
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
        }

        .history-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:hover {
            background: var(--bg-hover);
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .history-name {
            font-size: 12px;
            font-weight: 500;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-date {
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .history-prompt {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .history-tag {
            font-size: 10px;
            padding: 2px 6px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 8px;
            color: var(--accent);
        }

        .history-empty {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        .history-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .history-action-btn {
            flex: 1;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .history-action-btn:hover {
            border-color: var(--border-hover);
            background: var(--bg-hover);
        }

        .history-action-btn.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-color: transparent;
            color: white;
        }

        /* ─── Status Bar ────────────────────────────────────────────────────── */
        .status-bar {
            margin: 0 12px 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 8px;
            animation: slideUp 0.3s ease;
        }

        .status-bar.show {
            display: flex;
        }

        .status-bar.success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #34d399;
        }

        .status-bar.error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        .status-bar.info {
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: var(--accent);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ─── Eagle Offline Notice ─────────────────────────────────────────── */
        .eagle-offline-notice {
            display: none;
            margin: 0 12px;
            padding: 10px 12px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: #f87171;
            line-height: 1.5;
        }

        .eagle-offline-notice.show {
            display: block;
        }

        /* ─── Batch Progress ────────────────────────────────────────────────── */
        .batch-progress {
            display: none;
            padding: 12px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            margin: 12px;
        }

        .batch-progress.show {
            display: block;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 6px;
            background: var(--bg-input);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* ─── Scrollbar ─────────────────────────────────────────────────────── */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ─── Selection Info ────────────────────────────────────────────────── */
        .selection-info {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 8px;
        }

        /* ─── Footer ────────────────────────────────────────────────────────── */
        .footer {
            padding: 8px 12px 12px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <div class="header-top">
            <div class="logo">✨</div>
            <div class="title-group">
                <h1>咒语便签</h1>
                <p>v2.0.0 · 即梦AI作品采集</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="refreshBtn" title="刷新">🔄</button>
                <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
            </div>
        </div>
        <div class="eagle-status-row">
            <div class="eagle-status disconnected" id="eagleStatus">
                <div class="dot"></div>
                <span id="eagleStatusText">检测中...</span>
            </div>
            <span style="font-size:10px;color:var(--text-muted)">localhost:<span id="eaglePortDisplay">41595</span></span>
        </div>
    </div>

    <!-- Not Jimeng Warning -->
    <div class="not-jimeng-warning" id="notJimengWarning">
        <div class="warning-icon">🖼️</div>
        <div class="warning-title">请先打开即梦网站</div>
        <div class="warning-desc">
            此插件专为即梦AI创作平台设计<br>
            请先访问即梦，然后再使用此工具
        </div>
        <button class="open-jimeng-btn" id="openJimengBtn">打开即梦</button>
    </div>

    <!-- Main Content (shown only on Jimeng pages) -->
    <div id="mainContent" style="display:none">
        <!-- Eagle offline notice -->
        <div class="eagle-offline-notice" id="eagleOfflineNotice">
            ⚠️ Eagle 未运行，请先启动 Eagle 软件后再使用保存功能
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="current">
                🖼️ 当前页面
                <span class="tab-badge" id="currentCount">0</span>
            </button>
            <button class="tab-btn" data-tab="history">
                📋 历史记录
                <span class="tab-badge" id="historyCount">0</span>
            </button>
        </div>

        <!-- Current Tab -->
        <div class="tab-content active" id="tab-current">
            <!-- Folder Selector -->
            <div class="folder-section">
                <div class="folder-label-row">
                    <span class="folder-label">📁 保存到</span>
                    <span class="folder-count" id="folderCount">加载中...</span>
                </div>
                <div class="folder-select-wrapper">
                    <select class="folder-select" id="folderSelect">
                        <option value="">🏠 默认库（不指定文件夹）</option>
                    </select>
                    <div class="folder-select-arrow">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Tags -->
            <div class="tags-section">
                <div class="tags-label">🏷️ 自定义标签（点击删除）</div>
                <div class="tags-input-row">
                    <input type="text" class="tags-input" id="popupTagInput" placeholder="输入标签，按回车添加">
                </div>
                <div class="tags-display" id="popupTagsDisplay">
                    <span style="font-size:11px;color:var(--text-muted)">暂无标签</span>
                </div>
            </div>

            <!-- Note -->
            <div class="note-section">
                <div class="note-label">📝 备注（可选）</div>
                <textarea class="note-input" id="popupNoteInput" placeholder="添加备注信息，会保存到 Eagle 注释中..."></textarea>
            </div>

            <!-- Image List -->
            <div class="image-list-section">
                <div class="list-header">
                    <span class="list-title">📸 页面图片</span>
                    <div class="list-actions">
                        <button class="list-action-btn" id="selectAllBtn">全选</button>
                        <button class="list-action-btn" id="deselectAllBtn">取消</button>
                    </div>
                </div>
                <div class="image-list" id="imageList">
                    <div class="history-empty">
                        正在提取页面图片...<br>
                        <span style="font-size:10px;color:var(--text-muted)">点击刷新按钮重新提取</span>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="action-btn" id="formatPromptBtn">
                    ✨ 格式化提示词
                </button>
                <button class="action-btn" id="copyPromptBtn">
                    📋 复制提示词
                </button>
                <button class="action-btn primary" id="saveSelectedBtn" disabled>
                    💾 保存选中的图片到 Eagle
                </button>
            </div>

            <div class="selection-info" id="selectionInfo">
                已选择 0 张图片
            </div>
        </div>

        <!-- History Tab -->
        <div class="tab-content" id="tab-history">
            <div class="history-search-row">
                <input type="text" class="history-search" id="historySearch" placeholder="搜索历史记录（标题、提示词、标签）...">
                <select class="format-select" id="formatSelect">
                    <option value="cleaned">清理格式</option>
                    <option value="linebreak">换行分隔</option>
                    <option value="bullet">项目符号</option>
                    <option value="markdown">Markdown</option>
                </select>
            </div>

            <div class="history-list" id="historyList">
                <div class="history-empty">
                    暂无保存记录<br>
                    <span style="font-size:10px;color:var(--text-muted)">保存的图片会显示在这里</span>
                </div>
            </div>

            <div class="history-actions">
                <button class="history-action-btn" id="exportHistoryBtn">
                    📤 导出全部
                </button>
                <button class="history-action-btn" id="clearHistoryBtn">
                    🗑️ 清空历史
                </button>
                <button class="history-action-btn primary" id="copyAllPromptsBtn">
                    📋 复制全部提示词
                </button>
            </div>
        </div>
    </div>

    <!-- Batch Progress -->
    <div class="batch-progress" id="batchProgress">
        <div class="progress-text">
            <span>批量保存中...</span>
            <span id="progressCount">0 / 0</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
        <span id="statusIcon">✓</span>
        <span id="statusText"></span>
    </div>

    <!-- Footer -->
    <div class="footer" id="mainFooter" style="display:none">
        <span>PromptNote v2.0.0</span>
        <a href="https://jimeng.jianying.com/" target="_blank" id="gotoJimeng">访问即梦 →</a>
    </div>

    <script src="popup.js"></script>
</body>

</html>
